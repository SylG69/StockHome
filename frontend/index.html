        <meta name="theme-color" content="#000000" />
        <meta name="description" content="StockHome" />

             redimensionne, ce qui donne l'impression que tout est zoomé et
             coupé sur les côtés. -->

        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="StockHome" />
        <link rel="icon" type="image/x-icon" href="/favicon.ico" />
        <link rel="apple-touch-icon" href="/icons/icon-192.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />

        <title>StockHome | Gestion du stock pour la maison</title>

    </head>
